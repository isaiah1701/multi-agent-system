name: Terraform push

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm the reviewed production Terraform plan should be applied.
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-push-production
  cancel-in-progress: false

jobs:
  pre-apply-security-gate:
    name: Terraform fmt, validate, TFLint, and Checkov
    if: inputs.confirm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.11.0"
      - uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4
        with:
          tflint_version: v0.55.1
      - name: Enforce Terraform formatting
        run: terraform fmt -check -recursive serving/terraform
      - name: Initialize and validate without state access
        working-directory: serving/terraform/environments/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --format compact
      - name: Gate high and critical Terraform findings
        uses: bridgecrewio/checkov-action@5659ddea96102e16d8f221b3d8402453c0b1c150 # v12
        with:
          directory: serving/terraform
          framework: terraform
          download_external_modules: true
          soft_fail: false
          quiet: true
          hard_fail_on: HIGH,CRITICAL

  apply:
    name: Apply reviewed production infrastructure
    if: inputs.confirm
    needs: pre-apply-security-gate
    runs-on: ubuntu-24.04
    environment: production
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR }}
      TF_VAR_availability_zones: ${{ vars.TF_AVAILABILITY_ZONES_JSON }}
      TF_VAR_public_subnet_cidrs: ${{ vars.TF_PUBLIC_SUBNET_CIDRS_JSON }}
      TF_VAR_private_subnet_cidrs: ${{ vars.TF_PRIVATE_SUBNET_CIDRS_JSON }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'kubemind/prod/terraform.tfstate' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.11.0"
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize the locked production state backend
        working-directory: serving/terraform/environments/prod
        run: |
          test -n "${TF_STATE_BUCKET}"
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_VAR_aws_region}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Apply the reviewed configuration
        working-directory: serving/terraform/environments/prod
        run: terraform apply -input=false -auto-approve
