repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: eks
    url: https://aws.github.io/eks-charts

helmDefaults:
  atomic: true
  createNamespace: true
  timeout: 600
  wait: true

releases:
  # Helmfile owns only the bootstrap control plane. The bootstrap chart creates
  # Argo CD Applications for ESO, cert-manager, ExternalDNS, Langfuse, and
  # KubeMind so Argo CD owns their reconciliation after this initial install.
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 10.4.2
    labels:
      app: argocd
    values:
      - global:
          domain: argocd.5hort.site
        configs:
          params:
            server.insecure: true
        server:
          ingress:
            enabled: true
            ingressClassName: alb
            hostname: argocd.5hort.site
            tls: false
            annotations:
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/group.name: kubemind-public
              alb.ingress.kubernetes.io/group.order: "10"
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
              alb.ingress.kubernetes.io/ssl-redirect: "443"
              alb.ingress.kubernetes.io/healthcheck-path: /healthz
              external-dns.alpha.kubernetes.io/hostname: argocd.5hort.site

  - name: aws-load-balancer-controller
    namespace: kube-system
    chart: eks/aws-load-balancer-controller
    version: 1.14.0
    labels:
      app: aws-load-balancer-controller
    values:
      - clusterName: prod-cluster
        region: eu-west-2
        # Nodes enforce IMDSv2 with a one-hop limit, so the controller cannot
        # discover the VPC through pod network metadata.
        vpcId: vpc-04f2c38fe72247d9f
        serviceAccount:
          create: true
          name: aws-load-balancer-controller

  - name: kubemind-bootstrap
    namespace: argocd
    chart: ./serving/helm
    needs:
      - argocd/argocd
      - kube-system/aws-load-balancer-controller
    labels:
      app: kubemind-bootstrap
    values:
      - ./serving/helm/values/bootstrap.yaml
      - git:
          repoURL: https://github.com/isaiah1701/multi-agent-system.git
          targetRevision: main
