<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="KubeMind is a conversational Kubernetes and platform engineering assistant."
    />
    <title>KubeMind — Kubernetes, explained</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="KubeMind header">
        <a class="brand" href="/" aria-label="KubeMind home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>KubeMind</span>
        </a>
        <span class="availability"><span class="availability-dot" aria-hidden="true"></span>Online</span>
      </header>

      <main class="chat-layout">
        <section class="welcome" id="welcome" aria-labelledby="welcome-heading">
          <p class="eyebrow"><span aria-hidden="true"></span> Kubernetes assistant</p>
          <h1 id="welcome-heading">Kubernetes, explained.</h1>
          <p class="welcome-copy">
            Ask practical questions about clusters, workloads, and platform infrastructure in plain English.
          </p>
          <div class="suggestions" aria-label="Suggested questions">
            <button type="button" class="suggestion" data-question="What does a PodDisruptionBudget do?">
              What does a PDB do?
            </button>
            <button type="button" class="suggestion" data-question="Why is my pod CrashLoopBackOff?">
              Why is my pod crashing?
            </button>
            <button type="button" class="suggestion" data-question="How does the Horizontal Pod Autoscaler work?">
              How does HPA work?
            </button>
            <button type="button" class="suggestion" data-question="How should I deploy a workload on EKS?">
              How should I deploy on EKS?
            </button>
          </div>
        </section>

        <section id="conversation" class="conversation" aria-label="Conversation" aria-live="polite" hidden>
          <div id="messages" class="messages"></div>
        </section>

        <form id="composer" class="composer" novalidate>
          <label class="sr-only" for="question">Ask a Kubernetes question</label>
          <textarea
            id="question"
            name="question"
            rows="1"
            maxlength="4000"
            placeholder="Ask about Kubernetes, EKS, networking…"
            autocomplete="off"
            required
          ></textarea>
          <button id="send" class="send-button" type="submit" aria-label="Send question" title="Send question">
            <span aria-hidden="true">↑</span>
          </button>
        </form>
        <p id="composer-hint" class="composer-hint">Enter to send <span aria-hidden="true">·</span> Shift + Enter for a new line</p>
      </main>
    </div>
  </body>
</html>
