bootstrap:
  enabled: true

agentServices:
  enabled: false
  name: kubemind-agent-services
  namespace: kubemind
  chartPath: serving/helm

git:
  repoURL: ""
  targetRevision: main

project:
  name: kubemind

destination:
  server: https://kubernetes.default.svc

syncPolicy:
  automated: true
  selfHeal: true
  prune: true

langfuse:
  name: langfuse
  namespace: langfuse
  chartRepo: https://langfuse.github.io/langfuse-k8s
  chart: langfuse
  chartVersion: 1.5.41
  values:
    langfuse:
      salt:
        secretKeyRef:
          name: langfuse-runtime
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-runtime
          key: encryption-key
      nextauth:
        secret:
          secretKeyRef:
            name: langfuse-runtime
            key: nextauth-secret
      web:
        service:
          type: ClusterIP
    postgresql:
      auth:
        existingSecret: langfuse-runtime
        secretKeys:
          adminPasswordKey: postgresql-password
          userPasswordKey: postgresql-password
    clickhouse:
      auth:
        existingSecret: langfuse-runtime
        existingSecretKey: clickhouse-password
    redis:
      auth:
        existingSecret: langfuse-runtime
        existingSecretPasswordKey: redis-password
    s3:
      auth:
        existingSecret: langfuse-runtime
        rootUserSecretKey: s3-user
        rootPasswordSecretKey: s3-password
