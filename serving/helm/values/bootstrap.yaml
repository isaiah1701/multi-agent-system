bootstrap:
  enabled: true

agentServices:
  enabled: false
  name: kubemind-agent-services
  namespace: kubemind
  chartPath: serving/helm

persistence:
  storageClassConfig:
    enabled: false

git:
  repoURL: ""
  targetRevision: main

project:
  name: kubemind

destination:
  server: https://kubernetes.default.svc

syncPolicy:
  automated: true
  selfHeal: true
  prune: true

controllerApplications:
  - name: external-secrets
    namespace: external-secrets
    chartRepo: https://charts.external-secrets.io
    chart: external-secrets
    chartVersion: 2.10.0
    syncWave: "-4"

    values:
      installCRDs: true

      serviceAccount:
        create: true

        # This service account is bound to the EKS Pod Identity association
        # created by the production Terraform configuration.
        name: external-secrets

  - name: cert-manager
    namespace: cert-manager
    chartRepo: https://charts.jetstack.io
    chart: cert-manager
    chartVersion: v1.21.1
    syncWave: "-4"

    values:
      crds:
        enabled: true
        keep: true

      serviceAccount:
        create: true
        name: cert-manager

  - name: external-dns
    namespace: external-dns
    chartRepo: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    chartVersion: 1.21.1
    syncWave: "-3"

    values:
      provider:
        name: aws

      sources:
        - ingress

      policy: sync
      registry: txt
      txtOwnerId: kubemind-prod-cluster

      domainFilters:
        - 5hort.site

      serviceAccount:
        create: true
        name: external-dns

# AWS Secrets Manager -> External Secrets Operator -> Kubernetes Secret.
langfuseRuntimeSecret:
  enabled: true
  name: langfuse-runtime

  externalSecret:
    refreshInterval: 1h
    secretStoreName: kubemind-langfuse-aws-secrets-manager

    aws:
      region: eu-west-2
      secretId: kubemind/prod/langfuse-runtime

langfuse:
  name: langfuse
  namespace: langfuse

  runtimeSecretApplicationName: langfuse-runtime-secret
  runtimeSecretApplicationSyncWave: "-2"

  chartRepo: https://langfuse.github.io/langfuse-k8s
  chart: langfuse
  chartVersion: 1.5.41

  values:
    langfuse:
      # Pin to the Langfuse v3 release containing the dashboard API fix.
      image:
        tag: "3.224.4"

      ingress:
        enabled: true
        className: alb

        annotations:
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/group.name: kubemind-public
          alb.ingress.kubernetes.io/group.order: "20"
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/ssl-redirect: "443"
          alb.ingress.kubernetes.io/healthcheck-path: /api/public/health
          external-dns.alpha.kubernetes.io/hostname: langfuse.5hort.site

        hosts:
          - host: langfuse.5hort.site
            paths:
              - path: /
                pathType: Prefix

        # TLS terminates at the AWS ALB.
        tls:
          enabled: false

      salt:
        secretKeyRef:
          name: langfuse-runtime
          key: salt

      encryptionKey:
        secretKeyRef:
          name: langfuse-runtime
          key: encryption-key

      nextauth:
        url: https://langfuse.5hort.site

        secret:
          secretKeyRef:
            name: langfuse-runtime
            key: nextauth-secret

      smtp:
        connectionUrl: ses://eu-west-2
        fromAddress: no-reply@5hort.site

      web:
        service:
          type: ClusterIP

    postgresql:
      auth:
        existingSecret: langfuse-runtime

        secretKeys:
          adminPasswordKey: postgresql-password
          userPasswordKey: postgresql-password

    clickhouse:
      auth:
        existingSecret: langfuse-runtime
        existingSecretKey: clickhouse-password

      # Single lightweight replica for the current EKS environment.
      replicaCount: 1
      resourcesPreset: small

      zookeeper:
        replicaCount: 1
        resourcesPreset: nano

    redis:
      auth:
        existingSecret: langfuse-runtime
        existingSecretPasswordKey: redis-password

    s3:
      auth:
        existingSecret: langfuse-runtime
        rootUserSecretKey: s3-user
        rootPasswordSecretKey: s3-password

