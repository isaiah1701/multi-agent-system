{{- if .Values.bootstrap.enabled }}
{{- $runtimeSecret := .Values.langfuseRuntimeSecret }}
{{- $externalSecret := $runtimeSecret.externalSecret }}
{{- $namespace := .Values.langfuse.namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $externalSecret.secretStoreName }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $externalSecret.aws.region | quote }}
  conditions:
    - namespaces:
        - {{ $namespace | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $runtimeSecret.name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $runtimeSecret.name }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: salt
      remoteRef:
        key: {{ $externalSecret.aws.secretId | quote }}
        property: salt
    - secretKey: encryption-key
      remoteRef:
        key: {{ $externalSecret.aws.secretId | quote }}
        property: encryption-key
    - secretKey: nextauth-secret
      remoteRef:
        key: {{ $externalSecret.aws.secretId | quote }}
        property: nextauth-secret
    - secretKey: postgresql-password
      remoteRef:
        key: {{ $externalSecret.aws.secretId | quote }}
        property: postgresql-password
    - secretKey: clickhouse-password
      remoteRef:
        key: {{ $externalSecret.aws.secretId | quote }}
        property: clickhouse-password
    - secretKey: redis-password
      remoteRef:
        key: {{ $externalSecret.aws.secretId | quote }}
        property: redis-password
    - secretKey: s3-user
      remoteRef:
        key: {{ $externalSecret.aws.secretId | quote }}
        property: s3-user
    - secretKey: s3-password
      remoteRef:
        key: {{ $externalSecret.aws.secretId | quote }}
        property: s3-password
{{- end }}
