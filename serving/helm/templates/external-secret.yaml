{{- if and .Values.agentServices.enabled .Values.runtimeSecret.externalSecret.enabled }}
{{- $runtimeSecretName := required "runtimeSecret.name is required" .Values.runtimeSecret.name }}
{{- $externalSecret := .Values.runtimeSecret.externalSecret }}
{{- $storeName := required "runtimeSecret.externalSecret.secretStoreRef.name is required" $externalSecret.secretStoreRef.name }}
{{- $storeKind := required "runtimeSecret.externalSecret.secretStoreRef.kind is required" $externalSecret.secretStoreRef.kind }}
{{- $region := required "runtimeSecret.externalSecret.aws.region is required" $externalSecret.aws.region }}
{{- $secretID := required "runtimeSecret.externalSecret.aws.secretId is required" $externalSecret.aws.secretId }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $storeName }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The ESO controller uses its EKS Pod Identity. The Terraform role is scoped
  # to just the AWS Secrets Manager secret configured below.
  provider:
    aws:
      service: SecretsManager
      region: {{ $region | quote }}
  conditions:
    - namespaces:
        - {{ .Release.Namespace | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $runtimeSecretName }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ $storeKind }}
  target:
    name: {{ $runtimeSecretName }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ $secretID | quote }}
        property: ANTHROPIC_API_KEY
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: {{ $secretID | quote }}
        property: LANGFUSE_PUBLIC_KEY
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: {{ $secretID | quote }}
        property: LANGFUSE_SECRET_KEY
{{- end }}
