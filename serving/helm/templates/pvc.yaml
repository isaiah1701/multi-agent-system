{{- if .Values.agentServices.enabled }}
{{- $storageClass := .Values.persistence.storageClass }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubemind.fullname" . }}-chroma
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    # Retained during the blue-green migration to avoid destructive pruning of
    # the previous Chroma data. Retriever Rollouts no longer mount this claim.
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.chroma.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubemind.fullname" . }}-model-cache
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    # Retained during the blue-green migration. Retriever Rollouts now read the
    # model cached inside their immutable image.
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.modelCache.size }}
{{- end }}
