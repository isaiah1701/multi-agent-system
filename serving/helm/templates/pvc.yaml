{{- if .Values.agentServices.enabled }}
{{- $storageClass := .Values.persistence.storageClass }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubemind.fullname" . }}-chroma
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    # Dynamic EBS binding waits for a scheduled Pod, so keep the claims in
    # the same Argo CD wave as their consumer Deployments.
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.chroma.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubemind.fullname" . }}-model-cache
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $storageClass }}
  storageClassName: {{ $storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.modelCache.size }}
{{- end }}
