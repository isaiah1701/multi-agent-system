{{- if .Values.agentServices.enabled }}
{{- $runtimeSecretName := required "runtimeSecret.name is required" .Values.runtimeSecret.name }}
{{- range $name, $service := .Values.services }}
{{- $image := index $.Values.images $name }}
{{- if eq $name "retriever" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "kubemind.fullname" $ }}-{{ $name }}
  labels:
    {{- include "kubemind.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ if eq $name "retriever" }}"2"{{ else }}"1"{{ end }}
spec:
  {{- if eq $name "retriever" }}
  strategy:
    blueGreen:
      activeService: {{ include "kubemind.fullname" $ }}-retriever
      previewService: {{ include "kubemind.fullname" $ }}-retriever-preview
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30
  {{- end }}
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubemind.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubemind.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ include "kubemind.fullname" $ }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if eq $name "retriever" }}
      # The image contains an immutable index. A pod-local copy lets blue and
      # green revisions start concurrently without sharing a writable database.
      initContainers:
        - name: prepare-chroma-index
          image: "{{ required (printf "images.%s.repository is required" $name) $image.repository }}:{{ required (printf "images.%s.tag is required" $name) $image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /app/data/chroma-seed/. /app/data/chroma/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "kubemind.fullname" $ }}-config
          env:
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName }}
                  key: {{ required (printf "services.%s.langfuse.publicKeySecretKey is required" $name) $service.langfuse.publicKeySecretKey }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName }}
                  key: {{ required (printf "services.%s.langfuse.secretKeySecretKey is required" $name) $service.langfuse.secretKeySecretKey }}
          volumeMounts:
            - name: chroma
              mountPath: /app/data/chroma
            - name: temporary
              mountPath: /tmp
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ required (printf "images.%s.repository is required" $name) $image.repository }}:{{ required (printf "images.%s.tag is required" $name) $image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "kubemind.fullname" $ }}-config
            {{- if ne $name "api" }}
            - secretRef:
                name: {{ $runtimeSecretName }}
            {{- end }}
          env:
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName }}
                  key: {{ required (printf "services.%s.langfuse.publicKeySecretKey is required" $name) $service.langfuse.publicKeySecretKey }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName }}
                  key: {{ required (printf "services.%s.langfuse.secretKeySecretKey is required" $name) $service.langfuse.secretKeySecretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          volumeMounts:
            {{- if eq $name "retriever" }}
            - name: chroma
              mountPath: /app/data/chroma
            {{- end }}
            - name: temporary
              mountPath: /tmp
      volumes:
        {{- if eq $name "retriever" }}
        - name: chroma
          emptyDir: {}
        {{- end }}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemind.fullname" $ }}-{{ $name }}
  labels:
    {{- include "kubemind.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "kubemind.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ if eq $name "api" }}80{{ else }}{{ $service.port }}{{ end }}
      targetPort: http
---
{{- if eq $name "retriever" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemind.fullname" $ }}-retriever-preview
  labels:
    {{- include "kubemind.labels" $ | nindent 4 }}
    app.kubernetes.io/component: retriever
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "kubemind.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: retriever
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
---
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.ingress .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubemind.fullname" . }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls .Values.ingress.tls.enabled .Values.ingress.hostname }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostname | quote }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.ruleHostname }}
      host: {{ .Values.ingress.ruleHostname | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubemind.fullname" . }}-api
                port:
                  name: http
{{- end }}
