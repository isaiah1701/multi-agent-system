{{- if .Values.agentServices.enabled }}
{{- $runtimeSecretName := required "runtimeSecret.name is required" .Values.runtimeSecret.name }}
{{- range $name, $service := .Values.services }}
{{- $image := index $.Values.images $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubemind.fullname" $ }}-{{ $name }}
  labels:
    {{- include "kubemind.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubemind.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubemind.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      serviceAccountName: {{ include "kubemind.fullname" $ }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ required (printf "images.%s.repository is required" $name) $image.repository }}:{{ required (printf "images.%s.tag is required" $name) $image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "kubemind.fullname" $ }}-config
            {{- if ne $name "api" }}
            - secretRef:
                name: {{ $runtimeSecretName }}
            {{- end }}
          {{- if eq $name "api" }}
          env:
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName }}
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName }}
                  key: LANGFUSE_SECRET_KEY
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          volumeMounts:
            {{- if eq $name "retriever" }}
            - name: chroma
              mountPath: /app/data/chroma
            - name: model-cache
              mountPath: /home/app/.cache/huggingface
            {{- end }}
            - name: temporary
              mountPath: /tmp
      volumes:
        {{- if eq $name "retriever" }}
        - name: chroma
          persistentVolumeClaim:
            claimName: {{ include "kubemind.fullname" $ }}-chroma
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "kubemind.fullname" $ }}-model-cache
        {{- end }}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemind.fullname" $ }}-{{ $name }}
  labels:
    {{- include "kubemind.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "kubemind.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ if eq $name "api" }}80{{ else }}{{ $service.port }}{{ end }}
      targetPort: http
---
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubemind.fullname" . }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubemind.fullname" . }}-api
                port:
                  name: http
{{- end }}
