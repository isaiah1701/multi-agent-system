{{- $persistence := .Values.persistence | default (dict) }}
{{- $storageClassConfig := $persistence.storageClassConfig | default (dict) }}
{{- if and .Values.agentServices.enabled $storageClassConfig.enabled }}
{{- $storageClass := required "persistence.storageClass is required when persistence.storageClassConfig.enabled is true" $persistence.storageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $storageClass }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
{{- end }}
