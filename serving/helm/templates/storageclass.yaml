{{- if .Values.persistence.storageClassConfig.enabled }}
{{- $storageClass := required "persistence.storageClass is required when persistence.storageClassConfig.enabled is true" .Values.persistence.storageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $storageClass }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
{{- end }}
