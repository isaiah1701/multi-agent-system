    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; text-rendering: geometricPrecision; }
      .title { font-size: 31px; font-weight: 750; letter-spacing: -.7px; }
      .subtitle { font-size: 16px; font-weight: 450; fill: #64748B; }
      .lane { font-size: 17px; font-weight: 750; letter-spacing: -.2px; }
      .label { font-size: 15px; font-weight: 750; letter-spacing: -.15px; }
