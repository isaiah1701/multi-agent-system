  <rect width="1280" height="720" rx="24" fill="#F8FAFC"/>
  <text x="48" y="58" class="title">How changes reach production safely</text>
  <text x="48" y="85" class="subtitle">Two separate, checked paths move application and cloud changes into the live service.</text>

  <rect x="36" y="118" width="1208" height="252" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="64" y="151" class="lane">Application updates</text>
  <text x="64" y="173" class="detail">Test the AI → check the image → validate settings → deploy → confirm it is healthy</text>

  <g>
    <rect x="65" y="195" width="175" height="140" rx="16" fill="#FFF" stroke="#2563EB" stroke-width="2"/>
    <use href="#icon-actions" x="134" y="208" width="36" height="36"/>
    <text x="152" y="267" class="label" text-anchor="middle">Test the AI service</text>
    <text x="152" y="291" class="file" text-anchor="middle">agent-deploy.yml</text>
    <text x="152" y="313" class="detail" text-anchor="middle">answer and source checks</text>
  </g>
  <g>
    <rect x="260" y="195" width="175" height="140" rx="16" fill="#FFF" stroke="#2563EB" stroke-width="2"/>
    <use href="#icon-docker" x="314" y="208" width="36" height="36"/><use href="#icon-shield" x="348" y="208" width="36" height="36"/>
    <text x="347" y="267" class="label" text-anchor="middle">Build and scan</text>
    <text x="347" y="291" class="file" text-anchor="middle">image-deploy.yml</text>
    <text x="347" y="313" class="detail" text-anchor="middle">blocks serious risks</text>
  </g>
  <g>
    <rect x="455" y="195" width="175" height="140" rx="16" fill="#FFF" stroke="#ED7100" stroke-width="2"/>
    <use href="#aws-ecr" x="522" y="208" width="40" height="40"/>
    <text x="542" y="267" class="label" text-anchor="middle">Image library</text>
    <text x="542" y="291" class="file" text-anchor="middle">Amazon ECR</text>
    <text x="542" y="313" class="detail" text-anchor="middle">versioned, scanned images</text>
  </g>
  <g>
    <rect x="650" y="195" width="175" height="140" rx="16" fill="#FFF" stroke="#2563EB" stroke-width="2"/>
    <use href="#icon-helm" x="705" y="208" width="34" height="34"/><use href="#icon-shield" x="740" y="208" width="34" height="34"/>
    <text x="737" y="267" class="label" text-anchor="middle">Check deployment</text>
    <text x="737" y="291" class="file" text-anchor="middle">manfests-scan-push.yml</text>
    <text x="737" y="313" class="detail" text-anchor="middle">health and security checks</text>
  </g>
  <g>
    <rect x="845" y="195" width="175" height="140" rx="16" fill="#FFF" stroke="#14B8A6" stroke-width="2"/>
    <use href="#icon-argo" x="912" y="208" width="40" height="40"/>
    <text x="932" y="267" class="label" text-anchor="middle">Deploy changes</text>
    <text x="932" y="291" class="file" text-anchor="middle">Argo CD + Helm</text>
    <text x="932" y="313" class="detail" text-anchor="middle">keeps the service in sync</text>
  </g>
  <g>
    <rect x="1040" y="195" width="175" height="140" rx="16" fill="#FFF" stroke="#ED7100" stroke-width="2"/>
    <use href="#aws-eks" x="1107" y="208" width="40" height="40"/>
    <text x="1127" y="267" class="label" text-anchor="middle">Live service</text>
    <text x="1127" y="291" class="file" text-anchor="middle">Amazon EKS</text>
    <text x="1127" y="313" class="detail" text-anchor="middle">rollout and health checks</text>
  </g>
  <path d="M240 255h20" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M435 255h20" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M630 255h20" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M825 255h20" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1020 255h20" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="36" y="400" width="1208" height="270" rx="20" fill="#FAF5FF" stroke="#9333EA" stroke-width="2"/>
  <text x="64" y="434" class="lane">Cloud foundation</text>
  <text x="64" y="456" class="detail">Review the plan → approve it → create the secure cloud home → store private settings</text>

  <g>
    <rect x="95" y="490" width="180" height="140" rx="16" fill="#FFF" stroke="#9333EA" stroke-width="2"/>
    <use href="#icon-terraform" x="167" y="503" width="36" height="36"/>
    <text x="185" y="562" class="label" text-anchor="middle">Review cloud changes</text>
    <text x="185" y="586" class="file" text-anchor="middle">terraform-plan.yml</text>
    <text x="185" y="608" class="detail" text-anchor="middle">format, lint, security scan</text>
  </g>
  <g>
    <rect x="318" y="490" width="180" height="140" rx="16" fill="#FFF" stroke="#9333EA" stroke-width="2"/>
    <use href="#icon-terraform" x="390" y="503" width="36" height="36"/>
    <text x="408" y="562" class="label" text-anchor="middle">Approve and apply</text>
    <text x="408" y="586" class="file" text-anchor="middle">terraform-push.yml</text>
    <text x="408" y="608" class="detail" text-anchor="middle">protected production change</text>
  </g>
  <g>
    <rect x="541" y="490" width="180" height="140" rx="16" fill="#FFF" stroke="#ED7100" stroke-width="2"/>
    <use href="#aws-eks" x="613" y="503" width="40" height="40"/>
    <text x="631" y="562" class="label" text-anchor="middle">Cloud home</text>
    <text x="631" y="586" class="file" text-anchor="middle">private network + EKS</text>
    <text x="631" y="608" class="detail" text-anchor="middle">where KubeMind runs</text>
  </g>
  <g>
    <rect x="764" y="490" width="180" height="140" rx="16" fill="#FFF" stroke="#DD344C" stroke-width="2"/>
    <use href="#aws-iam" x="836" y="503" width="40" height="40"/>
    <text x="854" y="562" class="label" text-anchor="middle">Access control</text>
    <text x="854" y="586" class="file" text-anchor="middle">AWS IAM permissions</text>
    <text x="854" y="608" class="detail" text-anchor="middle">only the access needed</text>
  </g>
  <g>
    <rect x="987" y="490" width="180" height="140" rx="16" fill="#FFF" stroke="#DD344C" stroke-width="2"/>
    <use href="#aws-secrets" x="1059" y="503" width="40" height="40"/>
    <text x="1077" y="562" class="label" text-anchor="middle">Private settings</text>
    <text x="1077" y="586" class="file" text-anchor="middle">AWS Secrets Manager</text>
    <text x="1077" y="608" class="detail" text-anchor="middle">keeps keys out of code</text>
  </g>
