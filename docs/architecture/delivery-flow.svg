  <path d="M498 550h43" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M721 550h43" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M944 550h43" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
