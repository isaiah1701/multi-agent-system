  <rect width="1280" height="560" rx="20" fill="#F8FAFC"/>
  <text x="40" y="52" class="title">Where KubeMind runs in AWS</text>
  <text x="40" y="78" class="subtitle">The cloud building blocks that keep the application private, available, and secure.</text>

  <rect x="30" y="105" width="1220" height="415" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="58" y="137" class="group">KubeMind production environment</text>
  <line x1="55" y1="150" x2="1225" y2="150" stroke="#FDE68A"/>

  <rect x="60" y="178" width="250" height="145" rx="16" fill="#FFF" stroke="#FB923C" stroke-width="2"/>
  <use href="#aws-ecr" x="82" y="205" width="52" height="52"/>
  <text x="148" y="218" class="label">Image library</text>
  <text x="148" y="238" class="detail">Amazon ECR</text>
  <text x="82" y="283" class="tiny">• question coordinator</text>
  <text x="82" y="301" class="tiny">• source finder</text>
  <text x="82" y="319" class="tiny">• answer writer</text>

  <rect x="60" y="357" width="250" height="125" rx="16" fill="#FFF1F2" stroke="#FB7185" stroke-width="2"/>
  <use href="#aws-secrets-manager" x="82" y="382" width="52" height="52"/>
  <text x="148" y="395" class="label">Private settings</text>
  <text x="148" y="415" class="detail">AWS Secrets Manager</text>
  <text x="148" y="435" class="tiny">encrypted runtime values</text>

  <rect x="350" y="178" width="855" height="304" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <use href="#icon-vpc" x="378" y="174" width="28" height="28"/>
  <path d="M410 215h83" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  <text x="414" y="200" class="group">Private network · across availability zones</text>

  <rect x="385" y="230" width="570" height="218" rx="14" fill="#FFF7ED" stroke="#ED7100" stroke-width="2"/>
  <use href="#aws-eks" x="412" y="254" width="48" height="48"/>
  <text x="472" y="275" class="group">KubeMind application · Amazon EKS</text>
  <text x="472" y="295" class="detail">The managed home for the application</text>
  <rect x="410" y="325" width="170" height="84" rx="10" fill="#EDE9FE" stroke="#8B5CF6"/>
  <use href="#icon-kubernetes" x="482" y="331" width="26" height="26"/>
  <text x="495" y="373" class="label" text-anchor="middle">Application</text>
  <text x="495" y="390" class="tiny" text-anchor="middle">question · sources</text>
  <text x="495" y="403" class="tiny" text-anchor="middle">answer · knowledge</text>
  <rect x="600" y="325" width="170" height="84" rx="10" fill="#CCFBF1" stroke="#14B8A6"/>
  <use href="#icon-argo" x="660" y="332" width="24" height="24"/>
  <use href="#icon-helm" x="687" y="332" width="24" height="24"/>
  <text x="685" y="373" class="label" text-anchor="middle">Automated updates</text>
  <text x="685" y="390" class="tiny" text-anchor="middle">Argo CD + Helm</text>
  <text x="685" y="403" class="tiny" text-anchor="middle">keeps it in sync</text>
  <rect x="790" y="325" width="145" height="84" rx="10" fill="#FCE7F3" stroke="#EC4899"/>
  <use href="#icon-secret-sync" x="850" y="331" width="26" height="26"/>
  <text x="862" y="373" class="label" text-anchor="middle">Safe delivery</text>
  <text x="862" y="390" class="tiny" text-anchor="middle">External Secrets</text>
  <text x="862" y="403" class="tiny" text-anchor="middle">passes settings safely</text>

  <rect x="985" y="230" width="185" height="218" rx="14" fill="#FFF1F2" stroke="#DD344C" stroke-width="2"/>
  <use href="#aws-iam" x="1010" y="252" width="45" height="45"/>
  <text x="1067" y="270" class="label">Access control</text>
  <text x="1010" y="320" class="detail">AWS IAM roles</text>
  <text x="1010" y="345" class="tiny">• publish images</text>
  <text x="1010" y="368" class="tiny">• create infrastructure</text>
  <text x="1010" y="391" class="tiny">• check the cluster</text>
  <text x="1010" y="414" class="tiny">• read private settings</text>

  <path d="M310 250H350V271H385" fill="none" stroke="#ED7100" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="238" class="tiny">reviewed images</text>
  <path d="M310 420H757V367H790" fill="none" stroke="#DD344C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="411" class="tiny">private settings</text>
  <path d="M985 365H915" fill="none" stroke="#DD344C" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="925" y="350" class="tiny" text-anchor="end">least privilege</text>
</svg>
