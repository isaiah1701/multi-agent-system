    <symbol id="icon-helm" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="14" fill="#0F6CDB" opacity=".16"/><circle cx="20" cy="20" r="10" fill="none" stroke="#0F6CDB" stroke-width="2.5"/>
