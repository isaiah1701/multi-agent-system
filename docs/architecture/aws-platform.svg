<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">KubeMind AWS and Kubernetes placement</title>
  <desc id="desc">The AWS account contains a VPC, EKS cluster, three ECR repositories, Secrets Manager, and scoped IAM roles used by GitHub Actions and External Secrets.</desc>
