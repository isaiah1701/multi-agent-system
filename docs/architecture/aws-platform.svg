    </symbol>
    <symbol id="icon-vpc" viewBox="0 0 40 40">
      <path d="M7 28h26M10 28V16l10-7 10 7v12M15 28v-8h10v8" fill="#8B5CF6" opacity=".16"/>
      <path d="M7 28h26M10 28V16l10-7 10 7v12M15 28v-8h10v8" fill="none" stroke="#7C3AED" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="9" cy="10" r="3" fill="#C4B5FD"/><circle cx="31" cy="10" r="3" fill="#C4B5FD"/>
    </symbol>
    <symbol id="icon-kubernetes" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="14" fill="#326CE5" opacity=".16"/><circle cx="20" cy="20" r="14" fill="none" stroke="#326CE5" stroke-width="2.4"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="#326CE5" stroke-width="2.4"/>
      <path d="m20 6 3 10m11-4-8 7M34 28l-11-4M20 34l-3-10M6 28l11-4M6 12l8 7" fill="none" stroke="#326CE5" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-argo" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="16" fill="#F97316" opacity=".18"/><circle cx="20" cy="20" r="16" fill="none" stroke="#EA580C" stroke-width="2.4"/>
      <path d="M12 25h16l-3 5H15zM16 23l4-12 4 12z" fill="#EA580C"/><path d="M8 32c3-2 5 2 8 0s5 2 8 0 5 2 8 0" fill="none" stroke="#EA580C" stroke-width="2.1" stroke-linecap="round"/>
