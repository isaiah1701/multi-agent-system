    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; text-rendering: geometricPrecision; }
      .title { font-size: 30px; font-weight: 750; letter-spacing: -.65px; }.subtitle { font-size: 15px; font-weight: 450; fill: #64748B; }
      .group { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }.label { font-size: 14px; font-weight: 700; letter-spacing: -.12px; }
      .detail { font-size: 13px; font-weight: 450; fill: #475569; }.tiny { font-size: 11.5px; font-weight: 500; fill: #64748B; }
